services:
  app:
    build: .
    image: sikucur-app
    container_name: sikucur_app
    restart: unless-stopped
    working_dir: /app
    expose:
      - '8001'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      # media upload di-bind ke host -> persist walau rebuild, kelihatan di ./storage/app/public
      - ./storage/app/public:/app/storage/app/public
    networks:
      - sikucur_net
      - proxy
    depends_on:
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      # override nilai .env yg beda di dalam container (service name, bukan localhost)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: log
    command: >
      sh -c "
      mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache &&
      chown -R www-data:www-data storage bootstrap/cache &&
      chmod -R 775 storage bootstrap/cache &&
      php artisan storage:link --force 2>/dev/null || true &&
      php artisan config:cache &&
      php artisan route:cache &&
      php artisan view:cache &&
      php artisan migrate --force &&
      php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8001
      "

  worker:
    image: sikucur-app
    container_name: sikucur_worker
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./storage/app/public:/app/storage/app/public
    networks:
      - sikucur_net
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: log
    # --timeout >= job timeout (TranscodeVideo setTimeout 3600) supaya video besar tak keburu dibunuh
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=3700

  redis:
    image: redis:7-alpine
    container_name: sikucur_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    networks:
      - sikucur_net

volumes:
  redis_data:

networks:
  sikucur_net:
    driver: bridge
  proxy:
    external: true
